services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    env_file:
      - srv/pgbouncer/pgbouncer.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      LISTEN_ADDR: "*"
      LISTEN_PORT: "5432"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-processing-specifications-backend:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 ${BACKEND_CONTAINER_COMMAND}
    env_file:
      - .env
    environment:
      HF_HOME: ${HF_DATA_DIR}
    extra_hosts:
      # Доступ к сервисам хоста (например, локальный Ollama) из контейнера
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - hfdata:${HF_DATA_DIR}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    image: ai-processing-specifications-backend:latest
    restart: unless-stopped
    command: celery -A app.worker worker --loglevel=info
    env_file:
      - .env
    environment:
      HF_HOME: ${HF_DATA_DIR}
    extra_hosts:
      # Доступ к сервисам хоста (например, локальный Ollama) из контейнера
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - hfdata:${HF_DATA_DIR}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./srv/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./srv/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${POSTGRES_DATA_DIR}
  redisdata:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${REDIS_DATA_DIR}
  miniodata:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${MINIO_DATA_DIR}
  hfdata:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${HF_DATA_DIR}
